<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f3e6" />
    <meta
      name="description"
      content="Bladna — Discover Morocco, feel at home. Explore cities across all 12 Moroccan regions, from Casablanca and Tangier to the Sahara, and let your journey begin."
    />
    <title>BLADNA — Discover Morocco</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/img/favicon-48.png?v=1" />
    <link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png?v=1" />
    <link rel="icon" type="image/png" href="/img/zliij.png?v=1" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      try {
        var storedLang = localStorage.getItem("bladna-lang");
        if (storedLang === "ar") {
          document.documentElement.lang = "ar";
          document.documentElement.dir = "rtl";
        } else if (storedLang === "fr") {
          document.documentElement.lang = "fr";
        }
        var titles = {
          ar: "بلدنا — اكتشف المغرب",
          fr: "BLADNA — Découvrez le Maroc"
        };
        if (titles[storedLang]) document.title = titles[storedLang];
      } catch (error) {}
    </script>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap"
    />

    <link rel="preload" as="image" fetchpriority="high" href="/img/image%20.png" />

    <style>
      #root:empty::before {
        content: "";
        position: fixed;
        inset: 0;
        background: #f8f3e6;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
